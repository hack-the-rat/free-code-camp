<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Selection Feature Page</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Feature Selection</h1>
        <div class="feature-card-container">
            <label for="responsive-web-design" class="feature-card">
                <input type="checkbox" name="responsive-web-design" id="responsive-web-design">
                <h4>Responsive Web Design</h4>
                <p>Fundamentals of HTML and CSS, modern layout, design, accessibility, and responsive web development</p>
            </label>
            <label for="javascript" class="feature-card">
                <input type="checkbox" name="javascript" id="javascript">
                <h4>JavaScript</h4>
                <p>Core JavaScript programming concepts, variables, functions, objects, arrays, control flow, DOM, events, asynchronous programming, functional programming, and accessibility best practices</p>
            </label>
            <label for="front-end-libraries" class="feature-card">
                <input type="checkbox" name="front-end-libraries" id="front-end-libraries">
                <h4>Front-End Development Libraries</h4>
                <p>React, TypeScript, and more libraries used by developers to build webpages</p>
            </label>
            <label for="python" class="feature-card">
                <input type="checkbox" name="python" id="python">
                <h4>Python</h4>
                <p>Fundamentals of Python programming</p>
            </label>
            <label for="relational-databases" class="feature-card">
                <input type="checkbox" name="relational-databases" id="relational-databases">
                <h4>Relational Databases</h4>
                <p>Fundamentals of relational databases</p>
            </label>
            <label for="back-end-api" class="feature-card">
                <input type="checkbox" name="back-end-api" id="back-end-api">
                <h4>Back-End Development and APIs</h4>
                <p>fundamentals of back-end development and APIs</p>
            </label>
        </div>
    </body>
</html>
